plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.richo.taskmanagerapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.richo.taskmanagerapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler // Use your version defined in libs.versions.toml

    implementation("com.google.code.findbugs:jsr305:3.0.2") {
        exclude group: 'org.intellij', module: 'annotations'
    }

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
